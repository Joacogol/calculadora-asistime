<img class="bg" src="{{ d.foto }}">
<div class="scrim" style="background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.06) 30%,rgba(10,10,10,.30) 58%,rgba(10,10,10,.88) 100%)"></div>
<div class="pad" style="padding:{{ m.pad_top }}px 76px {{ m.pad_bot }}px;z-index:2">

  <div class="row">
    <div class="kicker" style="color:{{ ac }};font-size:34px;letter-spacing:.44em;padding-top:10px">{{ d.modalidad }}</div>
    {{ logo(1.32) }}
  </div>

  <div class="grow" style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px;min-height:0">
    <div class="disp" style="color:#FAFAFA;font-size:{{ m.dia }}px;line-height:.94">{{ d.dia }}</div>
    <div class="disp-b" style="color:{{ ac }};font-size:{{ m.hora }}px;line-height:.90;margin-top:6px">{{ d.hora }}</div>
    <div style="margin-top:30px">{{ aros(size=52, color=c.blanco, stroke=2.4, n=4, opacity=0.55) }}</div>
  </div>

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:48px">
    <div style="display:flex;gap:56px">
      <div>
        <div class="eyebrow" style="color:#FAFAFA;opacity:.62;font-size:24px">SEDE</div>
        <div class="kicker" style="color:#FAFAFA;font-size:32px;letter-spacing:.20em;margin-top:10px">{{ d.sede }}</div>
      </div>
      <div>
        <div class="eyebrow" style="color:#FAFAFA;opacity:.62;font-size:24px">INSCRIPCIÓN</div>
        <div class="kicker" style="color:{{ ac }};font-size:32px;letter-spacing:.20em;margin-top:10px">{{ d.cupos }}</div>
        {% if d.contacto %}<div class="body" style="color:#FAFAFA;opacity:.7;font-size:22px;margin-top:8px;letter-spacing:.05em">AL {{ d.contacto }}</div>{% endif %}
      </div>
    </div>
    <div style="text-align:right;flex:none">
      <div class="eyebrow" style="color:{{ ac }};font-size:26px">POR PAREJA</div>
      <div class="disp-b" style="color:#FAFAFA;font-size:{{ m.precio }}px;line-height:1;margin-top:4px">${{ d.precio_pareja }}</div>
    </div>
  </div>

</div>
