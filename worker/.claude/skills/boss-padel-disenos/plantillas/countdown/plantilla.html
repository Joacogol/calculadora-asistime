
<img class="bg" src="{{ d.foto }}" style="object-position:{{ d.foco }}">
<div class="scrim" style="background:linear-gradient(180deg,rgba(10,10,10,.72),rgba(10,10,10,.42) 45%,rgba(10,10,10,.90))"></div>
<div class="pad" style="padding:{{ m.pad_top }}px 76px {{ m.pad_bot }}px">
  <div class="row">
    <div class="kicker" style="color:{{ ac }};font-size:32px;line-height:1.5">{{ d.kicker }}</div>
    {{ logo(1.2) }}
  </div>
  <div class="grow" style="display:flex;flex-direction:column;justify-content:center;min-height:0">
    <div class="eyebrow" style="color:#FAFAFA;font-size:40px;letter-spacing:.30em;margin-bottom:-14px">FALTAN</div>
    <div style="display:flex;align-items:baseline;gap:26px">
      <div class="disp-b" style="color:{{ ac }};font-size:{{ m.num }}px;line-height:.82;letter-spacing:-.03em">{{ d.dias }}</div>
      <div class="disp" style="color:#FAFAFA;font-size:{{ m.num2 }}px;letter-spacing:.14em">DÍAS</div>
    </div>
    <div class="kicker" style="color:#FAFAFA;font-size:40px;letter-spacing:.30em;margin-top:26px">{{ d.fecha }}</div>
    <div class="kicker" style="color:{{ ac }};font-size:36px;letter-spacing:.46em;margin-top:12px">{{ d.sede }}</div>
  </div>
  <div>
    <div style="display:inline-block;background:{{ ac }};color:#0A0A0A;padding:20px 38px">
      <span class="eyebrow" style="font-weight:700;font-size:30px;letter-spacing:.16em">{{ d.cta }}</span></div>
    {% if d.contacto %}<div class="body" style="color:#FAFAFA;opacity:.8;font-size:28px;margin-top:18px;letter-spacing:.06em">INSCRIPCIONES AL {{ d.contacto.strip() }}</div>{% endif %}
  </div>
</div>
