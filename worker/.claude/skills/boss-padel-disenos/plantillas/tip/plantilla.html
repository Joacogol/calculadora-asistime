
<div class="scrim" style="background:linear-gradient(150deg,{{ d.fondo or c.azul_deep }} 0%,#0A0A0A 112%)"></div>
<div style="position:absolute;top:-100px;left:-190px;opacity:.22">{{ aros(380,'#FAFAFA',2.6) }}</div>
<div class="pad" style="padding:{{ m.pad_top }}px 76px {{ m.pad_bot }}px">
  <div class="row">{{ logo(1.3, align='left') }}
    <div class="kicker" style="color:{{ ac }};font-size:28px;text-align:right">{{ d.kicker }}</div></div>
  <div class="grow" style="display:flex;flex-direction:column;justify-content:center;min-height:0">
    <div class="disp-b" style="color:#FAFAFA;font-size:88px;line-height:.98;margin-bottom:32px">{{ d.titulo }}</div>
    <div class="body" style="color:#FAFAFA;opacity:.88;font-size:38px;line-height:1.52">{{ d.cuerpo }}</div>
  </div>
  <div class="kicker" style="color:{{ ac }};font-size:28px;letter-spacing:.22em">{{ d.firma }}</div>
</div>
