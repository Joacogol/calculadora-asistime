<div class="layer" style="background:{{ c.papel }}"></div><div class="content" style="top:{{ m.top }}px">{{ logo(0.8,c.verde) }}<div class="eyebrow">{{ d.rotulo|e }}</div><div class="title" style="font-size:{{ m.titulo }}px;max-width:870px">{{ d.titulo|e }}</div><div class="body" style="font-size:{{ m.body }}px;max-width:750px">{{ d.bajada|e }}</div></div><div style="position:absolute;left:0;right:0;bottom:{{ m.bottom-35 }}px;height:{{ m.alto*0.33 }}px;background:{{ c.verde }};border-radius:170px 0 0 0"></div><img class="product" src="{{ d.foto }}" style="right:80px;bottom:{{ m.bottom+90 }}px;width:440px;height:{{ m.alto*0.40 }}px"><div style="position:absolute;left:70px;bottom:{{ m.bottom+150 }}px;color:white;max-width:430px;background:{{ c.verde }};padding:24px;border-radius:24px">{% if d.descuento %}<div class="pill" style="font-size:32px">{{ d.descuento|e }}</div>{% endif %}{% if d.precio_anterior %}<div class="old">{{ d.precio_anterior|e }}</div>{% endif %}{% if d.precio_actual %}<div class="price">{{ d.precio_actual|e }}</div>{% endif %}<div class="body" style="font-size:27px">{{ d.lista|e }}</div></div><div class="footer" style="bottom:{{ m.bottom }}px;color:white"><span>{{ d.cta|e }}</span></div>
