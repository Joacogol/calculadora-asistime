{% set p = plan_titular(d.foto,c.verde,c.tinta,[0.4,0.88]) %}<img class="bg" src="{{ d.foto }}" style="object-position:{{ d.foco }}"><div class="layer" style="background:linear-gradient(180deg,transparent 12%,rgba(0,0,0,{{ [p.velo,0.55]|max }}) 100%)"></div><div class="content" style="bottom:{{ m.bottom+180 }}px;color:white;max-width:840px"><div class="eyebrow">{{ d.rotulo|e }}</div><div class="line"></div><div class="title" style="font-size:{{ m.titulo }}px">{{ d.titulo|e }}</div><div class="body" style="font-size:{{ m.body }}px">{{ d.bajada|e }}</div></div><div class="footer" style="bottom:{{ m.bottom }}px;color:white">{{ logo(0.92,c.blanco) }}<span>{{ d.cta|e }}</span></div>
