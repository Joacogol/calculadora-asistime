{% if d.foto %}<div class="photo-window" style="left:0;right:0;top:0;height:{{ m.foto_alto }}px"><img src="{{ d.foto }}" style="object-position:{{ d.foco }}"></div>{% endif %}<div class="content" style="top:{{ m.foto_alto+35 if d.foto else m.top }}px;gap:20px">{{ logo(0.72,c.verde) }}<div class="eyebrow">{{ d.rotulo|e }}</div><div class="title" style="font-size:{{ m.titulo*0.84 }}px">{{ d.titulo|e }}</div><div class="body" style="font-size:{{ m.body }}px">{{ d.bajada|e }}</div>{% if d.fecha %}<div class="pill" style="font-size:29px">{{ d.fecha|e }}</div>{% endif %}<div class="body" style="font-size:{{ m.body }}px">{{ d.lugar|e }}</div></div><div class="footer" style="bottom:{{ m.bottom }}px"><span>{{ d.cta|e }}</span></div>
