# Pruebas del motor. El despliegue de Larrique se realiza en Hetzner.
# No autenticar ni desplegar a Google Cloud desde este workflow.
name: worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "!worker/**/*.md", ".github/workflows/worker.yml", "deploy/hetzner/**"]
  pull_request:
    paths: ["worker/**", "!worker/**/*.md", ".github/workflows/worker.yml", "deploy/hetzner/**"]
  workflow_dispatch:

concurrency:
  group: worker-tests
  cancel-in-progress: false

defaults:
  run:
    working-directory: worker

jobs:
  pruebas:
    name: Pruebas del motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg y dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q jinja2 requests Pillow numpy
      - name: Instalador válido
        run: bash -n ../deploy/hetzner/instalar.sh
      - name: Las marcas cargan
        run: python3 herramientas/probar-marcas.py
      - name: Las pruebas que corre el despliegue
        run: |
          for P in probar-precios.py probar-video-solo.py probar-libro.py probar-revisor.py probar-cortes.py probar-crear-foto.py probar-encuadre-producto.py; do
            echo "── $P"; python3 "herramientas/$P"
          done
